version : '3.8'

service :
  jenkins :
    build:
      context : .
      dockerfile.jenkins : Dockerfile.jenkins
    platform : linux/amd64
    container_name : jenkins-local
    priviliged : true
    user : root
    ports : 
      - "8083:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace

volumes :
  jenkins_home:
